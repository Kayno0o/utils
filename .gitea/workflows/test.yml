name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - '**/*.js'

jobs:
  test:
    runs-on: debian
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
