name: Update Release Branch

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.gitea/actions/setup

      - name: Build package files
        run: bun run build

      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: release
          force_orphan: true
          exclude_assets: |
            .gitea
            .github
            .husky
            .vscode
            assets
            examples
            src
            tests
            types
            .*
            *.md
            *.lock
            *.toml
            *.config.*
            *.yml
            *.yaml
            eslint.config.js
            makefile
            tsconfig.json
            tsdown.config.ts
          user_name: 'forgejo-actions[bot]'
          user_email: 'forgejo-actions[bot]@noreply.git.kaynooo.fr'
          commit_message: 'Release build from ${{ github.sha }}'
