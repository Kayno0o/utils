name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.gitea/actions/setup

      - name: Build package files
        run: bun run build

      - name: Configure npm authentication
        run: |
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${FORGEJO_TOKEN}" > ~/.npmrc
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

      - name: Publish to Forgejo npm registry
        run: npm publish
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
