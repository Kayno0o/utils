name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build package files
        run: bun run build

      - name: Configure npm authentication
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Publish to Forgejo npm registry
        run: bun publish --access public --ignore-scripts
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # The same package goes to npmjs, where @kaynooo/cli-kit's users resolve it; the scope flag beats the repo .npmrc mapping @kaynooo to Forgejo. Its token goes in a config of its own, so ~/.npmrc keeps the Forgejo mapping the changelog step's bunx resolves through.
      - name: Publish to npmjs
        run: |
          config="$RUNNER_TEMP/npmjs.npmrc"
          trap 'rm -f "$config"' EXIT
          test -n "${NPM_TOKEN}" || { echo "the NPM_TOKEN secret is empty"; exit 1; }
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$config"
          bunx npm@12.2.1 publish --access public --ignore-scripts --userconfig "$config" --@kaynooo:registry=https://registry.npmjs.org/
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate changelog
        run: bun x @kaynooo/changelogitea@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
