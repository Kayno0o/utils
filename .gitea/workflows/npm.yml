name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project deps
        run: bun install --frozen-lockfile

      # Builds, publishes to Forgejo, and stages the same version on npmjs, where everyone but the owner installs it; it goes live once approved with `npm stage approve`. A version already on Forgejo is skipped, so a rerun publishes the rest.
      - uses: https://git.kaynooo.fr/kaynooo/actions/npm-publish@v1
        with:
          token: ${{ secrets.PACKAGE_TOKEN }}
          npm-token: ${{ secrets.NPM_STAGE_TOKEN }}

      - name: Generate changelog
        run: bun x @kaynooo/cli-changelog@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
