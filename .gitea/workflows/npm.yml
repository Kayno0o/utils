name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build package files
        run: bun run build

      - name: Configure npm authentication
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Publish to Forgejo npm registry
        run: npm publish
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Generate changelog
        run: bun x @kaynooo/changelogitea@latest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
