name: Setup Project
description: 'Install system dependencies, checkout code, setup Bun, and install project dependencies'

inputs:
  frozen-lockfile:
    description: Use --frozen-lockfile for bun install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install project dependencies
      run: bun install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}
      shell: bash
