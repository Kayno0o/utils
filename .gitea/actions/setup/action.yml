name: Setup Project
description: 'Install system dependencies, checkout code, setup Bun, and install project dependencies'

inputs:
  system-packages:
    description: Additional system packages to install (space-separated)
    required: false
    default: git
  frozen-lockfile:
    description: Use --frozen-lockfile for bun install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install system dependencies
      run: apt-get update && apt-get install -y ${{ inputs.system-packages }} unzip
      shell: bash

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install project dependencies
      run: bun install ${{ inputs.frozen-lockfile == 'true' && '--frozen-lockfile' || '' }}
      shell: bash
